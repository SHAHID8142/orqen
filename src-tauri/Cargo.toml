[package]
name = "orqen"
version = "0.1.0"
description = "Orqen — Local-first AI multi-agent development workspace"
authors = ["Shahidul Islam"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "orqen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Test-only build flag (never enabled by the app or release builds): lets
# `tests/execution_timeout.rs` shrink the 120 s diagnostic deadline so the
# timeout path can be exercised in seconds. See D-021.
[features]
test-timeouts = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
uuid = { version = "1.29", features = ["v4"] }
time = { version = "0.3", features = ["formatting", "parsing"] }

# Process-group termination for CLI verification probes (unix).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
